meters:
- name: gross_written_premium
  description: Premium written on policies bound via confirm offer (booking).
  unit: currency
  aggregation: sum
  dimensions:
  - partner
  - product
  - geo
- name: partner_commission
  description: Commission / revenue share earned by the partner on sold policies.
  unit: currency
  aggregation: sum
  dimensions:
  - partner
  - product
- name: taxes_and_surcharges
  description: Taxes and surcharges applied to premium per jurisdiction.
  unit: currency
  aggregation: sum
  dimensions:
  - partner
  - geo
- name: refunds
  description: Premium refunded on booking cancellations.
  unit: currency
  aggregation: sum
  dimensions:
  - partner
  - product
- name: claim_payouts
  description: Amounts paid out to customers via XClaim settlements.
  unit: currency
  aggregation: sum
  dimensions:
  - partner
  - product
principles:
- name: Visibility
  description: Reconcile premium, commission, refunds, and claim payouts from partner settlement reports and the XCover/XClaim webhook event stream.
- name: Allocation
  description: Tag bookings with partner_transaction_id and product to map premium and commission to internal lines of business.
- name: Optimization
  description: Tune offer placement, product mix, and conversion to maximize attach rate and commission; monitor cancellation/refund rates.
- name: Accountability
  description: Assign owners per product line; review attach rate, premium, and claims experience against targets on the agreement cycle.
