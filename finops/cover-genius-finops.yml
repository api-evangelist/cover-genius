description: >-
  FinOps view of a Cover Genius XCover / XClaim integration. Cover Genius is not
  a metered, pay-per-call API vendor; it is an embedded-insurance distribution
  partner. The relevant financial flows are premium-based - gross written
  premium on policies sold, commission / revenue share earned by the partner,
  taxes and surcharges, claim payouts, and refunds on cancellation - rather than
  per-API-request cloud spend. There is no published usage-based API price list,
  so cost is governed by the partner agreement and the volume/mix of policies
  sold. Meters below model the premium and settlement flows a partner would
  reconcile, not API call charges.
notes: >-
  Premium, commission, tax, and claims economics are governed by the partner
  distribution agreement and vary by product, geography, and insurer entity.
  Reconcile against partner settlement reports and the XCover/XClaim webhook
  event stream rather than an API price list.
