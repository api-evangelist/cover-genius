description: >-
  Cover Genius does not publish self-serve, public API pricing. XCover and
  XClaim are partner/commercial integrations: a partner signs a distribution
  agreement and Cover Genius (or its licensed insurer entities) underwrites
  embedded insurance products sold through the partner's checkout. The economic
  model is premium-based - partners earn commission / revenue share on policies
  sold, and Cover Genius retains underwriting and platform economics. There are
  no per-call API fees published; API access is provisioned with partner and
  testing API keys after commercial onboarding. Specific commercial terms are
  not reconciled in this artifact.
notes: >-
  Pricing is negotiated per partner agreement and is not publicly listed.
  Verify commission, revenue share, and product economics directly with a Cover
  Genius account manager / Client Solution Engineer during reconciliation.
sources:
- https://www.covergenius.com/xcover/
- https://partner-docs.covergenius.com/offers/api/reference
- https://partner-docs.covergenius.com/xclaim
